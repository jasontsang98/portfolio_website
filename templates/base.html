<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{personal.name}}{% endblock %}</title>
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .progress-container {
            width: 100%;
            height: 20px;
            background-color: #333333;
            border: 2px solid #ffffff;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background-color: #58a6ff;
            border-radius: 8px;
            transition: width 0.3s ease;
            width: 0%;
        }
        .progress-level-0 { width: 0%; }
        .progress-level-1 { width: 20%; }
        .progress-level-2 { width: 40%; }
        .progress-level-3 { width: 60%; }
        .progress-level-4 { width: 80%; }
        .progress-level-5 { width: 100%; }
    </style>
</head>
<body class="bg-dev-dark text-white min-h-screen">
    <!-- Main Content -->
    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    <footer class="bg-dev-gray mt-12 py-8">
        <div class="max-w-7xl mx-auto px-4 text-center text-gray-400">
            <p>&copy; 2024 {{ personal.name }}. Built with Flask and Tailwind CSS.</p>
        </div>
    </footer>
</body>
</html>
